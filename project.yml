name: IndoorKartData

options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: ru
  bundleIdPrefix: com.indoorkartdata
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IndoorKartData:
    type: application
    platform: iOS
    sources:
      - path: IndoorKartData
      - path: Shared
    # dependencies:
    #   - target: IndoorKartDataWatch
    # Раскомментировать после установки watchOS 26.5 platform (Xcode > Settings > Components)
    info:
      path: IndoorKartData/Info.plist
      properties:
        CFBundleDisplayName: IndoorKart
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Записываем звук двигателя карта для оценки оборотов и скорости.
        NSMotionUsageDescription: Записываем ускорения и повороты карта для анализа заезда.
        NSHealthShareUsageDescription: Используем пульс с Apple Watch, чтобы связать физическую нагрузку с динамикой заезда.
        NSHealthUpdateUsageDescription: Записываем заезд как workout в Health, чтобы часы собирали пульс всё время заезда.
    entitlements:
      path: IndoorKartData/IndoorKartData.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indoorkartdata.app
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  IndoorKartDataWatch:
    type: application
    platform: watchOS
    sources:
      - path: IndoorKartDataWatch
      - path: Shared
    info:
      path: IndoorKartDataWatch/Info.plist
      properties:
        CFBundleDisplayName: IndoorKart
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.indoorkartdata.app
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes:
          - workout-processing
        NSMotionUsageDescription: Записываем ускорения и повороты запястья для оценки действий рулём.
        NSHealthShareUsageDescription: Читаем пульс для записи его параллельно с данными заезда.
        NSHealthUpdateUsageDescription: Создаём workout-сессию, чтобы часы держали датчики активными во время заезда.
    entitlements:
      path: IndoorKartDataWatch/IndoorKartDataWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indoorkartdata.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
